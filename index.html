<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VULP FLOW — Vulp Air</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --vulp-sidebar: #0d2b38;
      --vulp-sidebar-active: #144357;
      --vulp-banner: #07222e;
      --vulp-bg: #f4f7f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--vulp-bg);
      color: #1e293b;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .sidebar-bg {
      background: linear-gradient(180deg, #0d2b38 0%, #091f29 100%);
    }

    .banner-bg {
      background-color: #07222e;
    }

    /* Barra de rolagem sutil para colunas do Kanban */
    .kanban-scroll::-webkit-scrollbar {
      height: 8px;
      width: 6px;
    }
    .kanban-scroll::-webkit-scrollbar-track {
      background: #eef2f6;
      border-radius: 9999px;
    }
    .kanban-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .kanban-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .task-card {
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
    }
    .task-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -6px rgba(15, 23, 42, 0.12);
    }

    .drag-over {
      background-color: #e0f2fe !important;
      border: 1.5px dashed #0284c7 !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Banner Superior de Contexto e Simulador de Visão -->
  <header class="banner-bg text-white px-3 sm:px-6 py-2.5 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2.5 z-30">
    <div id="top-context-banner" class="flex flex-wrap items-center gap-2 text-xs sm:text-sm">
      <!-- Atualizado dinamicamente via JS -->
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <label for="viewer-select" class="text-[11px] uppercase tracking-wider text-cyan-200/80 font-semibold">
        Simular visão de:
      </label>
      <select
        id="viewer-select"
        onchange="handleViewerChange(this.value)"
        class="bg-slate-900/90 text-white text-xs sm:text-sm font-medium border border-cyan-700/60 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-cyan-400 cursor-pointer"
      >
        <option value="KC">Kelly Costa (KC — Gestor Fiscal)</option>
        <option value="RB">RB (Usuário / Outro membro)</option>
      </select>

      <button
        type="button"
        onclick="openNewTaskModal()"
        class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <span>Nova Tarefa</span>
      </button>
    </div>
  </header>

  <!-- Shell Principal: Sidebar + Área de Trabalho -->
  <div class="flex-1 flex flex-col lg:flex-row min-h-0">

    <!-- Barra Lateral Esquerda -->
    <aside class="sidebar-bg text-slate-200 w-full lg:w-64 lg:shrink-0 flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-slate-800">
      <div>
        <!-- Logo VULP AIR / VULP FLOW -->
        <div class="px-5 py-4 border-b border-white/10 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <!-- Marca SVG Vulp Air -->
            <div class="w-9 h-9 rounded-xl bg-cyan-500/15 border border-cyan-400/30 flex items-center justify-center text-cyan-300">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16l6-6 4 4 8-8" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 6h4v4" />
                <circle cx="6" cy="18" r="2" fill="currentColor" />
              </svg>
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="font-bold tracking-wider text-white text-sm">VULP</span>
                <span class="text-[10px] font-semibold uppercase tracking-widest bg-cyan-400/20 text-cyan-200 px-1.5 py-0.5 rounded">AIR</span>
              </div>
              <div class="text-[11px] font-semibold tracking-widest text-cyan-300/90 mt-0.5">
                VULP FLOW
              </div>
            </div>
          </div>

          <button
            type="button"
            onclick="toggleMobileNav()"
            class="lg:hidden text-slate-300 hover:text-white p-1.5 rounded-lg"
            aria-label="Alternar menu"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>

        <!-- Navegação -->
        <nav id="sidebar-nav" class="px-3 py-4 space-y-5">
          <!-- OPERAÇÕES -->
          <div>
            <div class="px-3 mb-2 text-[10px] font-semibold uppercase tracking-widest text-slate-400">
              OPERAÇÕES
            </div>
            <div class="space-y-1">
              <button
                id="nav-tarefas"
                type="button"
                onclick="switchTab('tarefas')"
                class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer"
              >
                <span class="flex items-center gap-2.5">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                  </svg>
                  <span>Tarefas</span>
                </span>
                <span id="badge-count-tarefas" class="text-xs font-bold px-2 py-0.5 rounded-full bg-cyan-400/20 text-cyan-200">
                  0
                </span>
              </button>

              <button
                id="nav-projetos"
                type="button"
                onclick="switchTab('projetos')"
                class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer"
              >
                <span class="flex items-center gap-2.5">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                  </svg>
                  <span>Projetos</span>
                </span>
                <span id="badge-count-projetos" class="text-xs font-bold px-2 py-0.5 rounded-full bg-white/10 text-slate-200">
                  1
                </span>
              </button>
            </div>
          </div>

          <!-- BASE & EQUIPE -->
          <div>
            <div class="px-3 mb-2 text-[10px] font-semibold uppercase tracking-widest text-slate-400">
              BASE &amp; EQUIPE
            </div>
            <div class="space-y-1">
              <button
                id="nav-documentos"
                type="button"
                onclick="switchTab('documentos')"
                class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer"
              >
                <span class="flex items-center gap-2.5">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                  </svg>
                  <span>Documentos</span>
                </span>
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-white/10 text-slate-300">2</span>
              </button>

              <button
                id="nav-equipe"
                type="button"
                onclick="switchTab('equipe')"
                class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer"
              >
                <span class="flex items-center gap-2.5">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                  </svg>
                  <span>Equipe e Estrutura</span>
                </span>
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-white/10 text-slate-300">11</span>
              </button>
            </div>
          </div>
        </nav>
      </div>

      <!-- Legenda de Cores por Responsável na Sidebar -->
      <div class="p-4 border-t border-white/10 bg-black/20">
        <div class="text-[10px] font-semibold uppercase tracking-widest text-slate-400 mb-2.5">
          Cores por Responsável
        </div>
        <div id="sidebar-color-legend" class="space-y-2">
          <!-- Renderizado via JS -->
        </div>
      </div>
    </aside>

    <!-- Área de Conteúdo Principal -->
    <main class="flex-1 min-w-0 p-4 sm:p-6 space-y-5">

      <!-- Cabeçalho da Seção Ativa -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div>
          <div class="flex flex-wrap items-center gap-2.5">
            <h1 id="page-title" class="text-2xl font-bold text-slate-900 tracking-tight">Tarefas</h1>
            <span id="page-subtitle-metrics" class="text-xs sm:text-sm text-slate-500 font-medium">
              <!-- Métricas dinâmicas -->
            </span>
          </div>
          <p id="page-rule-hint" class="text-xs sm:text-sm text-slate-600 mt-1">
            <!-- Explicação da regra de visibilidade ativa -->
          </p>
        </div>

        <!-- Legenda Interativa de Cores em Barra -->
        <div id="top-person-pills" class="flex flex-wrap items-center gap-1.5">
          <!-- Renderizado via JS -->
        </div>
      </div>

      <!-- Barra de Filtros -->
      <section id="filters-bar" class="bg-white border border-slate-200/90 rounded-2xl p-3.5 shadow-xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-7 gap-2.5 items-center">
          <select id="filter-prazo" onchange="renderActiveView()" class="filter-select bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-cyan-500">
            <option value="Todos">Prazo: Todos</option>
            <option value="Hoje">Prazo: Hoje (27/11)</option>
            <option value="Semana">Prazo: Esta Semana</option>
          </select>

          <select id="filter-projeto" onchange="renderActiveView()" class="filter-select bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-cyan-500">
            <option value="Todos">Projeto / Rotina: Todos</option>
            <option value="P-1 • Reforma tributária - NF de locação">P-1 • Reforma tributária - NF de locação</option>
          </select>

          <select id="filter-epico" onchange="renderActiveView()" class="filter-select bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-cyan-500">
            <option value="Todos">Épico: Todos</option>
            <option value="E-6 • Governança de Dados, Ativos e NCM">E-6 • Governança de Dados, Ativos e NCM</option>
            <option value="E-2 • Adequação NFS-e ADN (01/01/2027)">E-2 • Adequação NFS-e ADN (01/01/2027)</option>
          </select>

          <select id="filter-area" onchange="renderActiveView()" class="filter-select bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-cyan-500">
            <option value="Todos">Área: Todas</option>
            <option value="Fiscal">Fiscal</option>
            <option value="Operações / Ativos">Operações / Ativos</option>
            <option value="TI / CIS">TI / CIS</option>
            <option value="Estoque / CSC">Estoque / CSC</option>
          </select>

          <select id="filter-responsavel" onchange="renderActiveView()" class="filter-select bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-cyan-500">
            <option value="Todos">Responsável: Todos</option>
            <option value="KC">KC — Kelly Costa</option>
            <option value="RB">RB — Rafael / Usuário</option>
            <option value="AL">AL — André (Estoque)</option>
            <option value="MC">MC — Márcio (TI / CIS)</option>
          </select>

          <select id="filter-frequencia" onchange="renderActiveView()" class="filter-select bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-cyan-500">
            <option value="Todos">Frequência: Todas</option>
            <option value="Pontual">Pontual</option>
            <option value="Diária">Diária</option>
            <option value="Semanal">Semanal</option>
          </select>

          <div class="relative">
            <input
              id="filter-busca"
              type="text"
              oninput="renderActiveView()"
              placeholder="Buscar por código ou título..."
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-500"
            />
          </div>
        </div>
      </section>

      <!-- Container Dinâmico das Abas -->
      <div id="view-container"></div>

    </main>
  </div>

  <!-- Modal de Criação Rápida de Tarefa -->
  <div id="new-task-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-lg p-5 sm:p-6 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div>
          <h2 class="text-lg font-bold text-slate-900">Nova Tarefa — Vulp Flow</h2>
          <p class="text-xs text-slate-500">Teste a visibilidade no Kanban ("Tarefas") vs. visão completa em "Projetos".</p>
        </div>
        <button type="button" onclick="closeNewTaskModal()" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="new-task-form" onsubmit="createTask(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Título da tarefa</label>
          <input
            id="task-title"
            type="text"
            required
            placeholder="Ex.: Conferir NCMs de evaporadoras Carrier no XML"
            class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Responsável</label>
            <select id="task-assignee" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
              <option value="RB">RB (Não é liderado da KC)</option>
              <option value="KC">KC — Kelly Costa (Gestor Fiscal)</option>
              <option value="AL">AL — André / Estoque (Liderado KC)</option>
              <option value="MC">MC — Márcio / TI-CIS (Liderado KC)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Coluna inicial (Kanban)</label>
            <select id="task-status" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
              <option value="A FAZER">A FAZER</option>
              <option value="EM ANDAMENTO">EM ANDAMENTO</option>
              <option value="AGUARDANDO RETORNO">AGUARDANDO RETORNO</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Projeto</label>
            <select id="task-project" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
              <option value="P-1 • Reforma tributária - NF de locação">P-1 • Reforma tributária - NF de locação</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Épico</label>
            <select id="task-epic" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
              <option value="E-6 • Governança de Dados, Ativos e NCM">E-6 • Governança de Dados, Ativos e NCM</option>
              <option value="E-2 • Adequação NFS-e ADN (01/01/2027)">E-2 • Adequação NFS-e ADN (01/01/2027)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Área</label>
            <select id="task-area" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
              <option value="Operações / Ativos">Operações / Ativos</option>
              <option value="Fiscal">Fiscal</option>
              <option value="TI / CIS">TI / CIS</option>
              <option value="Estoque / CSC">Estoque / CSC</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Prazo</label>
            <input id="task-due" type="text" value="27/11" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500" />
          </div>
        </div>

        <label class="flex items-center gap-2 text-xs text-slate-700 bg-slate-50 p-2.5 rounded-xl border border-slate-200 cursor-pointer">
          <input id="task-delegated-kc" type="checkbox" class="rounded border-slate-300 text-cyan-600 focus:ring-cyan-500" />
          <span>Demanda explicitamente delegada para a Kelly Costa (KC)</span>
        </label>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeNewTaskModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 cursor-pointer">
            Cancelar
          </button>
          <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold bg-cyan-600 hover:bg-cyan-500 text-white shadow-xs cursor-pointer">
            Salvar Tarefa
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast de Feedback -->
  <div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-lg border border-slate-700 hidden z-50">
  </div>

  <script>
    /**
     * Configuração padronizada de cores por pessoa/responsável.
     * Cada pessoa possui cor de avatar, borda lateral no card, tag de cor e cor de destaque.
     */
    const PEOPLE = {
      KC: {
        code: 'KC',
        name: 'Kelly Costa',
        role: 'Gestor Fiscal',
        area: 'Fiscal',
        isLedByKC: false, // A própria gestora
        avatarBg: '#0284c7',     // Azul vibrante
        avatarText: '#ffffff',
        accentHex: '#0284c7',
        cardBorder: '#0284c7',
        badgeBg: '#e0f2fe',
        badgeText: '#0369a1',
        dotClass: 'bg-sky-500'
      },
      RB: {
        code: 'RB',
        name: 'RB (Usuário)',
        role: 'Analista / Reforma Tributária',
        area: 'Operações / Ativos',
        isLedByKC: false, // Regra explícita: KC NÃO é líder de RB
        avatarBg: '#7c3aed',     // Roxo/Violeta
        avatarText: '#ffffff',
        accentHex: '#7c3aed',
        cardBorder: '#7c3aed',
        badgeBg: '#ede9fe',
        badgeText: '#5b21b6',
        dotClass: 'bg-violet-600'
      },
      AL: {
        code: 'AL',
        name: 'André (Estoque)',
        role: 'Liderado Fiscal/Estoque',
        area: 'Estoque / CSC',
        isLedByKC: true,  // Liderado direto da área/liderança KC
        avatarBg: '#059669',     // Esmeralda
        avatarText: '#ffffff',
        accentHex: '#059669',
        cardBorder: '#059669',
        badgeBg: '#d1fae5',
        badgeText: '#065f46',
        dotClass: 'bg-emerald-600'
      },
      MC: {
        code: 'MC',
        name: 'Márcio (TI / CIS)',
        role: 'Liderado Integração/CIS',
        area: 'TI / CIS',
        isLedByKC: true,  // Liderado direto da área/liderança KC
        avatarBg: '#d97706',     // Âmbar/Laranja
        avatarText: '#ffffff',

    /**

     *   Aparecem apenas tarefas próprias (assignee === 'KC'), tarefas de liderados diretos (PEOPLE[assignee].isLedByKC)
     *   ou tarefas explicitamente delegadas à KC (delegatedToKC === true).
     *   Tarefas de RB (que não é liderado da KC) NÃO aparecem no Kanban da Kelly!
     * - Quando a visão é de RB:
     *   Exibe as tarefas do RB (e demandas relacionadas a ele).
     */
    function isTaskVisibleInKanban(task, viewerCode) {
      if (viewerCode === 'KC') {
        const person = PEOPLE[task.assignee];
        const isOwnTask = task.assignee === 'KC';
        const isDirectReport = Boolean(person && person.isLedByKC);
        const isDelegatedToKC = Boolean(task.delegatedToKC);
        return isOwnTask || isDirectReport || isDelegatedToKC;
      }

      if (viewerCode === 'RB') {
        return task.assignee === 'RB';
      }

      return true;
    }

    function getFilteredTasks() {
      const prazo = document.getElementById('filter-prazo').value;
      const projeto = document.getElementById('filter-projeto').value;
      const epico = document.getElementById('filter-epico').value;
      const area = document.getElementById('filter-area').value;
      const responsavel = document.getElementById('filter-responsavel').value;
      const frequencia = document.getElementById('filter-frequencia').value;
      const busca = document.getElementById('filter-busca').value.trim().toLowerCase();

      return state.tasks.filter((t) => {
        if (prazo !== 'Todos' && t.prazoBucket !== prazo) return false;
        if (projeto !== 'Todos' && t.project !== projeto) return false;
        if (epico !== 'Todos' && t.epic !== epico) return false;
        if (area !== 'Todos' && t.area !== area) return false;
        if (responsavel !== 'Todos' && t.assignee !== responsavel) return false;
        if (frequencia !== 'Todos' && t.frequency !== frequencia) return false;
        if (busca) {
          const hay = `${t.id} ${t.title} ${t.project} ${t.epic} ${t.assignee}`.toLowerCase();
          if (!hay.includes(busca)) return false;
        }
        return true;
      });
    }

                            </span>
                          </td>
                          <td class="py-3 px-4 font-medium text-slate-900 max-w-md">${escapeHtml(t.title)}</td>
                          <td class="py-3 px-4 text-xs text-slate-600 whitespace-nowrap">${t.epic}</td>
                          <td class="py-3 px-4 whitespace-nowrap">
                            <select
                              onchange="moveTaskStatus('${t.id}', this.value)"
                              class="text-xs bg-slate-100 border border-slate-200 rounded-lg px-2 py-1 font-semibold text-slate-700 cursor-pointer"
                            >
                              <option value="A FAZER" ${t.status === 'A FAZER' ? 'selected' : ''}>A FAZER</option>
                              <option value="EM ANDAMENTO" ${t.status === 'EM ANDAMENTO' ? 'selected' : ''}>EM ANDAMENTO</option>
                              <option value="AGUARDANDO RETORNO" ${t.status === 'AGUARDANDO RETORNO' ? 'selected' : ''}>AGUARDANDO RETORNO</option>
                            </select>
                          </td>
                          <td class="py-3 px-4 text-xs font-medium text-slate-600 whitespace-nowrap">${t.due}</td>
                          <td class="py-3 px-4 whitespace-nowrap">
                            ${
                              inKCBoard
                                ? `<span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">Sim (Kanban KC)</span>`
                                : `<span class="text-xs font-semibold bg-violet-100 text-violet-800 px-2.5 py-1 rounded-full">Não (Só Projetos)</span>`
                            }
                          </td>
                        </tr>
                      `;
                    })
                    .join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderDocumentsView() {
      const container = document.getElementById('view-container');
      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-2 shadow-2xs">
            <div class="text-xs font-bold uppercase tracking-wider text-cyan-700">Planilha de Origem • Ativos</div>
            <h3 class="text-base font-bold text-slate-900">Depreciacao-CIS-102026-CONCILIADO-todos os cálculos.r2.xlsx</h3>
            <p class="text-xs text-slate-600">
              Aba <strong>Out26-Temp Restante</strong>: base consolidada da Vulp Air (legenda B = Baixado, E = Em Depreciação, D = Depreciado) para levantamento de NCM e validação fiscal.
            </p>
          </div>

          <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-2 shadow-2xs">
            <div class="text-xs font-bold uppercase tracking-wider text-amber-700">Normativo &amp; Integração</div>
            <h3 class="text-base font-bold text-slate-900">Ato Conjunto RFB/CGIBS nº 7/2026 &amp; NF-Stock XML</h3>
            <p class="text-xs text-slate-600">
              Obrigatoriedade da NFS-e de locação no ADN prorrogada para 01/01/2027; consulta de XML/NCM via MS-Exportação NF-Stock e saneamento de NFs no Bimer.
            </p>
          </div>
        </div>
      `;
    }

    function renderTeamView() {
      const container = document.getElementById('view-container');
      container.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          ${Object.values(PEOPLE)
            .map(
              (p) => `
              <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-2xs space-y-2.5" style="border-top: 4px solid ${p.accentHex};">
                <div class="flex items-center gap-3">
                  <span
                    class="w-10 h-10 rounded-full text-sm font-bold flex items-center justify-center shrink-0"
                    style="background-color:${p.avatarBg};color:${p.avatarText};"
                  >${p.code}</span>
                  <div>
                    <div class="text-sm font-bold text-slate-900">${p.name}</div>
                    <div class="text-xs text-slate-500">${p.role}</div>
                  </div>
                </div>
                <div class="text-xs text-slate-600">
                  <strong>Área:</strong> ${p.area}
                </div>
                <div class="text-[11px] font-semibold px-2.5 py-1 rounded-lg inline-block" style="background-color:${p.badgeBg};color:${p.badgeText};">
                  ${
                    p.code === 'KC'
                      ? 'Gestor Fiscal (Visão própria + liderados)'
                      : p.isLedByKC
                        ? 'Liderado da KC (Visível no Kanban da KC)'
                        : 'Não é liderado da KC (Visível em Projetos)'
                  }
                </div>
              </div>
            `
            )
            .join('')}
        </div>
      `;
    }

    function renderActiveView() {
      renderBannerAndHeader();
      if (state.activeTab === 'tarefas') {
        renderKanbanView();
      } else if (state.activeTab === 'projetos') {
        renderProjectsView();
      } else if (state.activeTab === 'documentos') {
        renderDocumentsView();
      } else if (state.activeTab === 'equipe') {
        renderTeamView();
      }
    }

    function moveTaskStatus(taskId, newStatus) {
      const task = state.tasks.find((t) => t.id === taskId);
      if (!task) return;
      task.status = newStatus;
      renderActiveView();
      showToast(`Tarefa ${task.id} movida para "${newStatus}".`);
    }

    function onDragStart(event, taskId) {
      draggedTaskId = taskId;
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', taskId);
    }

    function onDragOver(event) {
      event.preventDefault();
      const zone = event.currentTarget;
      zone.classList.add('drag-over');
    }

    function onDragLeave(event) {
      event.currentTarget.classList.remove('drag-over');
    }

    function onDrop(event, statusId) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      const taskId = draggedTaskId || event.dataTransfer.getData('text/plain');
      draggedTaskId = null;
      if (taskId) {
        moveTaskStatus(taskId, statusId);
      }
    }

    function openNewTaskModal() {
      const modal = document.getElementById('new-task-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('task-title').focus();
    }

    function closeNewTaskModal() {
      const modal = document.getElementById('new-task-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.getElementById('new-task-form').reset();
    }

    function createTask(event) {
      event.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      const assignee = document.getElementById('task-assignee').value;
      const status = document.getElementById('task-status').value;
      const project = document.getElementById('task-project').value;
      const epic = document.getElementById('task-epic').value;
      const area = document.getElementById('task-area').value;
      const due = document.getElementById('task-due').value.trim() || '27/11';
      const delegatedToKC = document.getElementById('task-delegated-kc').checked;

      if (!title) return;

      const newId = `T-${state.nextTaskNum++}`;
      state.tasks.unshift({
        id: newId,
        title,
        project,
        epic,
        area,
        assignee,
        delegatedToKC,
        due,
        prazoBucket: 'Hoje',
        frequency: 'Pontual',
        status
      });

      closeNewTaskModal();
      renderActiveView();

      const visibleToKC = isTaskVisibleInKanban(state.tasks[0], 'KC');
      showToast(
        visibleToKC
          ? `Tarefa ${newId} criada e visível no Kanban da KC e na aba Projetos.`
          : `Tarefa ${newId} criada para ${assignee}: visível na aba Projetos e oculta no Kanban da KC.`
      );
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 3600);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Inicialização
    window.addEventListener('DOMContentLoaded', () => {
      renderColorLegends();
      renderActiveView();
    });
  </script>
</body>
</html>
